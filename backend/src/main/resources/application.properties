spring.application.name=coordination-system
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CoordinationDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.config.import=optional:file:backend/.env.local[.properties],optional:file:.env.local[.properties]
app.security.token-secret=${APP_TOKEN_SECRET:}
spring.jpa.hibernate.ddl-auto=validate
server.error.include-message=never
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
