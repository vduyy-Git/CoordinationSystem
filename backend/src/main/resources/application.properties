spring.application.name=coordination-system
server.port=8088
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=MSSQLSERVER1;databaseName=CoordinationDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:coord_user}
spring.datasource.password=${DB_PASSWORD:CoordPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.config.import=optional:file:backend/.env.local[.properties],optional:file:.env.local[.properties]
app.security.token-secret=${APP_TOKEN_SECRET:CoordinationSystemDefaultSecretKeyMustBeAtLeast32BytesLong2026!}
app.staff.registration-pin=${APP_STAFF_REGISTRATION_PIN:123456}
app.security.cors-origins=${APP_SECURITY_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173}
spring.jpa.hibernate.ddl-auto=validate
server.error.include-message=never
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
APP_STAFF_REGISTRATION_PIN=123456
