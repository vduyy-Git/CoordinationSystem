<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081422"/>
      <stop offset="35%" stop-color="#0E2036"/>
      <stop offset="70%" stop-color="#162E4C"/>
      <stop offset="100%" stop-color="#0B1A2E"/>
    </linearGradient>

    <!-- Golden & Cyan Radial Glows -->
    <radialGradient id="centerGlow" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#2A5FAA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#081422" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#1D4370" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0E2036" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#081422" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D86B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#4A7A42" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#081422" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Fill -->
  <rect width="1600" height="900" fill="url(#navyBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="280" r="380" fill="url(#centerGlow)" filter="url(#blurFilter)"/>
  <circle cx="300" cy="720" r="450" fill="url(#bottomGlow)" filter="url(#blurFilter)"/>
  <circle cx="1300" cy="650" r="350" fill="url(#heartGlow)" filter="url(#blurFilter)"/>

  <!-- Compassionate Stylized Hand / Shield Network Lines (Subtle Vector Grid) -->
  <g stroke="#D4AF37" stroke-opacity="0.12" stroke-width="1" fill="none">
    <!-- Concentric Waves of Support -->
    <circle cx="800" cy="450" r="280" stroke-dasharray="6,6"/>
    <circle cx="800" cy="450" r="420" stroke-dasharray="4,8"/>
    <circle cx="800" cy="450" r="580" stroke-dasharray="3,12"/>
    <circle cx="800" cy="450" r="750" stroke-dasharray="2,16"/>

    <!-- Interconnected Community Network Lines -->
    <line x1="200" y1="200" x2="450" y2="350"/>
    <line x1="450" y1="350" x2="680" y2="280"/>
    <line x1="680" y1="280" x2="920" y2="240"/>
    <line x1="920" y1="240" x2="1150" y2="340"/>
    <line x1="1150" y1="340" x2="1400" y2="220"/>

    <line x1="450" y1="350" x2="520" y2="580"/>
    <line x1="680" y1="280" x2="800" y2="480"/>
    <line x1="920" y1="240" x2="1020" y2="520"/>
    <line x1="1150" y1="340" x2="1280" y2="560"/>

    <line x1="520" y1="580" x2="800" y2="480"/>
    <line x1="800" y1="480" x2="1020" y2="520"/>
    <line x1="1020" y1="520" x2="1280" y2="560"/>
    <line x1="800" y1="480" x2="800" y2="720"/>
    <line x1="520" y1="580" x2="650" y2="760"/>
    <line x1="1020" y1="520" x2="950" y2="760"/>
  </g>

  <!-- Relief Nodes (Glowing Circles representing Care Hubs) -->
  <g fill="#D4AF37" filter="url(#softGlow)">
    <circle cx="450" cy="350" r="5" fill="#F5D86B" fill-opacity="0.8"/>
    <circle cx="680" cy="280" r="6" fill="#F5D86B" fill-opacity="0.9"/>
    <circle cx="920" cy="240" r="5" fill="#F5D86B" fill-opacity="0.8"/>
    <circle cx="1150" cy="340" r="6" fill="#F5D86B" fill-opacity="0.85"/>
    <circle cx="800" cy="480" r="8" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="520" cy="580" r="5" fill="#4A7A42" fill-opacity="0.8"/>
    <circle cx="1020" cy="520" r="6" fill="#5A8AD4" fill-opacity="0.8"/>
    <circle cx="1280" cy="560" r="5" fill="#F5D86B" fill-opacity="0.75"/>
    <circle cx="800" cy="720" r="6" fill="#4A7A42" fill-opacity="0.8"/>
  </g>

  <!-- Glowing Pulses -->
  <circle cx="800" cy="480" r="24" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="800" cy="480" r="48" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Subtle Floating Sparkles -->
  <g fill="#FFF" opacity="0.6">
    <circle cx="280" cy="180" r="1.5"/>
    <circle cx="580" cy="150" r="2"/>
    <circle cx="880" cy="110" r="1.5"/>
    <circle cx="1220" cy="160" r="2"/>
    <circle cx="1380" cy="380" r="1"/>
    <circle cx="210" cy="490" r="1.5"/>
    <circle cx="390" cy="680" r="2"/>
    <circle cx="720" cy="820" r="1.5"/>
    <circle cx="1100" cy="780" r="2"/>
    <circle cx="1450" cy="620" r="1.5"/>
  </g>
</svg>
